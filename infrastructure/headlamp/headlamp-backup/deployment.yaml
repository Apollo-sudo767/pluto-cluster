apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
  labels:
    app.kubernetes.io/name: headlamp
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: headlamp
  template:
    metadata:
      labels:
        app.kubernetes.io/name: headlamp
    spec:
      serviceAccountName: headlamp
      initContainers:
        - name: init-kubeconfig
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              mkdir -p /home/headlamp/.config/Headlamp/kubeconfigs
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)
              cat <<EOF > /home/headlamp/.config/Headlamp/kubeconfigs/config
              apiVersion: v1
              kind: Config
              clusters:
              - cluster:
                  certificate-authority: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
                  server: https://kubernetes.default.svc:443
                name: pluto-cluster
              contexts:
              - context:
                  cluster: pluto-cluster
                  user: headlamp-viewer
                name: pluto-cluster
              current-context: pluto-cluster
              users:
              - name: headlamp-viewer
                user:
                  token: $TOKEN
              EOF
              chmod 755 /home/headlamp/.config/Headlamp/kubeconfigs
              chmod 644 /home/headlamp/.config/Headlamp/kubeconfigs/config
          volumeMounts:
            - name: kubeconfig
              mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.29.0
          args:
            - "-in-cluster"
          ports:
            - containerPort: 4466
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 4466
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: kubeconfig
              mountPath: /home/headlamp/.config/Headlamp/kubeconfigs
      volumes:
        - name: kubeconfig
          emptyDir: {}
