apiVersion: v1
kind: ConfigMap
metadata:
  name: jellyfin-lb-config
  namespace: media
data:
  haproxy.cfg: |
    global
        log stdout format raw local0 info
        maxconn 4096

    defaults
        log     global
        mode    http
        option  httplog
        option  dontlognull
        option  forwardfor
        timeout connect 5s
        timeout client  300s
        timeout server  300s
        timeout tunnel  3600s
        timeout http-keep-alive 60s

    resolvers k8s
        nameserver dns1 10.43.0.10:53
        resolve_retries 3
        timeout retry   1s
        hold valid      10s

    frontend jellyfin_front
        bind :8096
        mode http

        # Health check for Kubernetes probes
        monitor-uri /lb-health

        # Pass through protocol headers from Cloudflare
        acl is_cf hdr_cnt(CF-Connecting-IP) gt 0
        http-request set-header X-Forwarded-Proto https if is_cf
        http-request set-header X-Forwarded-Port 443 if is_cf

        default_backend jellyfin_back

    backend jellyfin_back
        mode http
        balance leastconn

        # Cookie-based sticky sessions for browser and app clients
        cookie JF_NODE insert indirect nocache httponly

        # Stick table fallback for clients without cookie support
        stick-table type string len 64 size 100k expire 12h
        acl has_token hdr_cnt(X-Emby-Token) gt 0
        acl has_cf_ip hdr_cnt(CF-Connecting-IP) gt 0
        stick on req.hdr(X-Emby-Token) if has_token
        stick on req.hdr(CF-Connecting-IP) if !has_token has_cf_ip

        # Health checks on /health
        option httpchk GET /health
        http-check expect status 200

        server hydra jellyfin-hydra.media.svc.cluster.local:8096 check resolvers k8s init-addr none inter 3s fall 2 rise 2 cookie hydra
        server styx jellyfin-styx.media.svc.cluster.local:8096 check resolvers k8s init-addr none inter 3s fall 2 rise 2 cookie styx

    listen stats
        bind :8404
        mode http
        stats enable
        stats uri /
        stats refresh 5s

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-lb
  namespace: media
  labels:
    app: jellyfin-lb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin-lb
  template:
    metadata:
      labels:
        app: jellyfin-lb
    spec:
      containers:
        - name: haproxy
          image: haproxy:2.9-alpine
          ports:
            - name: http
              containerPort: 8096
            - name: stats
              containerPort: 8404
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /usr/local/etc/haproxy
          livenessProbe:
            httpGet:
              path: /lb-health
              port: 8096
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /lb-health
              port: 8096
            initialDelaySeconds: 2
            periodSeconds: 5
      volumes:
        - name: config
          configMap:
            name: jellyfin-lb-config
