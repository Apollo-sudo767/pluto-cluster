apiVersion: apps/v1
kind: Deployment
metadata:
  name: zotero
  namespace: productivity
  labels:
    app: zotero
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zotero
  template:
    metadata:
      labels:
        app: zotero
    spec:
      initContainers:
        - name: init-storage
          image: busybox:latest
          command: ["sh", "-c", "mkdir -p /data/zotero && chmod 777 /data/zotero"]
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        # 1. Hacdias WebDAV backend engine
        - name: webdav
          image: hacdias/webdav:latest
          args: ["-c", "/etc/webdav/webdav.yaml"]
          ports:
            - containerPort: 8081
              name: webdav
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /etc/webdav/webdav.yaml
              subPath: webdav.yaml
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"

        # 2. Nginx reverse proxy sidecar (Zotero MKCOL & prefix compatibility)
        - name: nginx-proxy
          image: nginx:alpine
          ports:
            - containerPort: 80
              name: http
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
          resources:
            requests:
              cpu: "50m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: zotero-data
        - name: config
          configMap:
            name: zotero-config
