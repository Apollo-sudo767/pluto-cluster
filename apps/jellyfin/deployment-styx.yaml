apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin-styx
  namespace: media
  labels:
    app: jellyfin-styx
    app.kubernetes.io/part-of: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin-styx
  template:
    metadata:
      labels:
        app: jellyfin-styx
        app.kubernetes.io/part-of: jellyfin
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-31T15:37:00Z"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - styx
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
      initContainers:
        - name: restore-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              # 1. Ensure SSH authorized key exists on Styx
              mkdir -p /persist-ssh
              if ! grep -q "fireshifter767@gmail.com" /persist-ssh/authorized_keys 2>/dev/null; then
                echo "Adding SSH authorized key to Styx..."
                echo "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOrQIV1E1f48sJ9t6FYPfZpZ5k99MyzWbh5qK/M2mie/ fireshifter767@gmail.com" >> /persist-ssh/authorized_keys
                chmod 700 /persist-ssh
                chmod 600 /persist-ssh/authorized_keys
              fi

              # 2. Extract base config if missing
              if [ ! -f /config/data/jellyfin.db ]; then
                echo "Waiting for Jellyfin seed tarball on shared NFS..."
                count=0
                while [ ! -f /media/.jellyfin-seed/jellyfin-config.tar.gz ] && [ $count -lt 30 ]; do
                  sleep 2
                  count=$((count+1))
                done

                if [ -f /media/.jellyfin-seed/jellyfin-config.tar.gz ]; then
                  echo "Extracting seed config to Styx local storage..."
                  tar -xzf /media/.jellyfin-seed/jellyfin-config.tar.gz -C /config/
                  chmod -R 777 /config

                  if [ -f /config/config/system.xml ]; then
                    sed -i 's/<ServerName>.*<\/ServerName>/<ServerName>Apollan (Styx)<\/ServerName>/' /config/config/system.xml
                  fi
                  echo "Styx Jellyfin config initialized successfully."
                fi
              fi

              # 3. Synchronize fresh database snapshot from shared NFS if available
              if [ -f /media/.jellyfin-seed/jellyfin-fresh.db ]; then
                echo "Synchronizing fresh live DB snapshot to Styx..."
                cp /media/.jellyfin-seed/jellyfin-fresh.db /config/data/jellyfin.db
                chmod 666 /config/data/jellyfin.db
                echo "Database synchronized."
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: persist-ssh
              mountPath: /persist-ssh
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-styx
        - name: media
          persistentVolumeClaim:
            claimName: media-storage
        - name: dri
          hostPath:
            path: /dev/dri
        - name: persist-ssh
          hostPath:
            path: /persist/home/apollo/.ssh
            type: DirectoryOrCreate
