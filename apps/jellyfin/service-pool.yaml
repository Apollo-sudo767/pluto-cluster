apiVersion: v1
kind: Service
metadata:
  name: jellyfin-pool
  namespace: media
  labels:
    app: jellyfin-pool
spec:
  type: ClusterIP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 86400
  ports:
    - port: 8096
      targetPort: 8096
      name: http
  selector:
    app.kubernetes.io/part-of: jellyfin
