apiVersion: v1
kind: ServiceAccount
metadata:
  name: factorio-cleanup-sa
  namespace: games
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: factorio-cleanup-role
  namespace: games
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: factorio-cleanup-binding
  namespace: games
subjects:
  - kind: ServiceAccount
    name: factorio-cleanup-sa
    namespace: games
roleRef:
  kind: Role
  name: factorio-cleanup-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: Job
metadata:
  name: factorio-force-delete-stuck-pod
  namespace: games
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      serviceAccountName: factorio-cleanup-sa
      restartPolicy: Never
      containers:
        - name: kubectl
          image: bitnami/kubectl:latest
          command:
            - /bin/sh
            - -c
            - |
              echo "Force deleting stuck pods in games namespace..."
              kubectl delete pod factorio-server-69f8454b5-6q8bh -n games --force --grace-period=0 || true
