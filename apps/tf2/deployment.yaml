apiVersion: apps/v1
kind: Deployment
metadata:
  name: tf2-server
  namespace: games
  labels:
    app: tf2
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tf2
  template:
    metadata:
      labels:
        app: tf2
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.type
                    operator: In
                    values:
                      - compute
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      initContainers:
        - name: init-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /home/steam/tf-dedicated/tf/cfg
              cp -fv /etc/tf2-configs/* /home/steam/tf-dedicated/tf/cfg/
              chown -R 1000:1000 /home/steam/tf-dedicated/tf/cfg
          volumeMounts:
            - name: data
              mountPath: /home/steam/tf-dedicated
            - name: configs
              mountPath: /etc/tf2-configs
      containers:
        - name: tf2
          image: cm2network/tf2:latest
          ports:
            - containerPort: 27015
              name: game-udp
              protocol: UDP
            - containerPort: 27015
              name: rcon-tcp
              protocol: TCP
            - containerPort: 27020
              name: sourcetv-udp
              protocol: UDP
          env:
            - name: SRCDS_PORT
              value: "27015"
            - name: SRCDS_STARTMAP
              value: "pl_badwater"
            - name: SRCDS_MAXPLAYERS
              value: "24"
            - name: SRCDS_REGION
              value: "0"
            - name: SRCDS_HOSTNAME
              value: "Pluto | Casual Pub & Comp 6s [St. Louis, MO]"
            - name: SRCDS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tf2-secret
                  key: SRCDS_TOKEN
                  optional: true
            - name: SRCDS_RCONPW
              valueFrom:
                secretKeyRef:
                  name: tf2-secret
                  key: SRCDS_RCONPW
                  optional: true
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "4Gi"
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /home/steam/tf-dedicated
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: tf2-data
        - name: configs
          configMap:
            name: tf2-config
