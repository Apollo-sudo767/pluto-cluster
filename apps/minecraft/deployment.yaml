apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: games
  labels:
    app: minecraft
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.type
                    operator: In
                    values:
                      - compute
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      containers:
        - name: minecraft-server
          image: itzg/minecraft-server:latest
          ports:
            - containerPort: 25565
              hostPort: 25565
              name: minecraft
            - containerPort: 24454
              hostPort: 24454
              protocol: UDP
              name: voicechat
          env:
            - name: EULA
              value: "TRUE"
            - name: VERSION
              value: "1.21.1"
            - name: TYPE
              value: "MODRINTH"
            - name: MODRINTH_MODPACK
              value: "https://cdn.modrinth.com/data/QuPh0YK2/versions/qdW92qW2/PhasMC%27s%20No%20Man%27s%20Land.mrpack?mr_download_reason=standalone"
            - name: MODRINTH_FORCE_SYNCHRONIZE
              value: "true"
            - name: MOTD
              value: "§8» §6No Man's Land §8« §7- §f1.21.1"
            - name: ICON
              value: "https://raw.githubusercontent.com/Apollo-sudo767/solar/main/assets/icons/no-mans-land.png"
            - name: OVERRIDE_ICON
              value: "true"
            - name: MEMORY
              value: "8G"
            - name: JVM_XX_OPTS
              value: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch"
            - name: ENABLE_RCON
              value: "true"
            - name: RCON_PASSWORD
              value: "b962db8175967f602b027465"
            - name: RCON_PORT
              value: "25575"
            - name: ENFORCE_SECURE_PROFILE
              value: "false"
          resources:
            requests:
              memory: "6Gi"
              cpu: "2"
            limits:
              memory: "12Gi"
              cpu: "4"
          volumeMounts:
            - name: data
              mountPath: /data
        - name: backup
          image: itzg/mc-backup:latest
          env:
            - name: RCON_HOST
              value: "localhost"
            - name: RCON_PORT
              value: "25575"
            - name: RCON_PASSWORD
              value: "b962db8175967f602b027465"
            - name: BACKUP_INTERVAL
              value: "6h"
            - name: INITIAL_DELAY
              value: "2m"
            - name: PRUNE_BACKUPS_DAYS
              value: "7"
            - name: EXCLUDES
              value: "*.jar,cache,logs,*.tmp,*.sqlite,*.mrpack,backups"
            - name: TZ
              value: "America/Chicago"
            - name: POST_BACKUP_SCRIPT_FILE
              value: "/scripts/post-backup.sh"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: data
              mountPath: /backups
              subPath: backups
            - name: backup-scripts
              mountPath: /scripts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-data
        - name: backup-scripts
          configMap:
            name: minecraft-backup-script
            defaultMode: 0755
