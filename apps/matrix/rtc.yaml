apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-rtc
  namespace: productivity
  labels:
    app: matrix-rtc
    component: rtc
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: matrix-rtc
      component: rtc
  template:
    metadata:
      labels:
        app: matrix-rtc
        component: rtc
    spec:
      # Strictly pin to hydra and styx (keeping pluto compute dedicated to game servers)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - styx
                      - hydra
      dnsConfig:
        nameservers:
          - 1.1.1.1
          - 9.9.9.9
      initContainers:
        - name: init-livekit-config
          image: alpine:3.20
          command:
            - sh
            - -c
            - |
              set -e
              mkdir -p /var/lib/tuwunel/.secrets
              if [ -f /run/k8s-secrets/LIVEKIT_SECRET ]; then
                LK_SECRET=$(cat /run/k8s-secrets/LIVEKIT_SECRET | tr -d '\n\r ')
              elif [ -s /var/lib/tuwunel/.secrets/livekit_secret ]; then
                LK_SECRET=$(cat /var/lib/tuwunel/.secrets/livekit_secret | tr -d '\n\r ')
              else
                LK_SECRET=$(head -c 32 /dev/urandom | base64 | tr -dc 'a-zA-Z0-9' | head -c 40)
                echo -n "$LK_SECRET" > /var/lib/tuwunel/.secrets/livekit_secret
              fi

              cat <<EOF > /etc/livekit/livekit.yaml
              port: 7880
              bind_addresses:
                - "0.0.0.0"
              rtc:
                tcp_port: 7881
                udp_port: 7882
                use_external_ip: true
                enable_loopback_candidate: false
              room:
                auto_create: false
                empty_timeout: 300
                max_participants: 50
              keys:
                solar-matrix-rtc: "${LK_SECRET}"
              logging:
                level: info
              EOF
              echo -n "$LK_SECRET" > /etc/livekit/secret
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
            - name: matrix-data
              mountPath: /var/lib/tuwunel
            - name: k8s-secrets
              mountPath: /run/k8s-secrets
              readOnly: true
      containers:
        # 1. LiveKit Selective Forwarding Unit (SFU) for MatrixRTC Voice & Screen Streaming
        - name: livekit-sfu
          image: livekit/livekit-server:latest
          args:
            - "--config"
            - "/etc/livekit/livekit.yaml"
          ports:
            - containerPort: 7880
              name: signaling
              protocol: TCP
            - containerPort: 7881
              hostPort: 7881
              name: rtc-tcp
              protocol: TCP
            - containerPort: 7882
              hostPort: 7882
              name: rtc-udp
              protocol: UDP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "2"
              memory: "1Gi"
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true

        # 2. Element Call / MatrixRTC JWT Authentication Broker
        - name: lk-jwt-service
          image: ghcr.io/element-hq/lk-jwt-service:latest
          env:
            - name: LIVEKIT_JWT_BIND
              value: ":8081"
            - name: LIVEKIT_URL
              value: "wss://rtc.apollan.cc"
            - name: LIVEKIT_KEY
              value: "solar-matrix-rtc"
            - name: LIVEKIT_SECRET_FROM_FILE
              value: "/etc/livekit/secret"
            - name: LIVEKIT_FULL_ACCESS_HOMESERVERS
              value: "matrix.apollan.cc"
          ports:
            - containerPort: 8081
              name: jwt-http
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: livekit-config
              mountPath: /etc/livekit
              readOnly: true

        # 3. Unified Nginx Ingress Sidecar (routes /sfu/get -> lk-jwt-service and / -> livekit-sfu)
        - name: rtc-proxy
          image: nginx:alpine
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: rtc-nginx.conf
              readOnly: true
      volumes:
        - name: livekit-config
          emptyDir: {}
        - name: matrix-data
          persistentVolumeClaim:
            claimName: matrix-data
        - name: config
          configMap:
            name: matrix-config
        - name: k8s-secrets
          secret:
            secretName: matrix-secret
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-rtc
  namespace: productivity
  labels:
    app: matrix-rtc
    component: rtc
spec:
  type: ClusterIP
  selector:
    app: matrix-rtc
    component: rtc
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
    - name: rtc-tcp
      port: 7881
      targetPort: 7881
      protocol: TCP
    - name: rtc-udp
      port: 7882
      targetPort: 7882
      protocol: UDP
