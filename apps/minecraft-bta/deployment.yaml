apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft-bta
  namespace: games
  labels:
    app: minecraft-bta
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: minecraft-bta
  template:
    metadata:
      labels:
        app: minecraft-bta
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node.type
                    operator: In
                    values:
                      - compute
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      dnsConfig:
        nameservers:
          - 1.0.0.1
          - 9.9.9.9
      containers:
        - name: minecraft-bta-server
          image: itzg/minecraft-server:java17
          ports:
            - containerPort: 25565
              hostPort: 25565
              name: minecraft
          env:
            - name: EULA
              value: "TRUE"
            - name: TYPE
              value: "CUSTOM"
            - name: CUSTOM_SERVER
              value: "https://downloads.betterthanadventure.net/bta-server/release/v8.0.1/bta.v8.0.1.server.jar"
            - name: VERSION
              value: "8.0.1"
            - name: MOTD
              value: "§8» §2Better Than Adventure! §8« §7- §fBeta 1.7.3 (8.0.1)"
            - name: MEMORY
              value: "6G"
            - name: JVM_XX_OPTS
              value: "-XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch"
            - name: ENFORCE_SECURE_PROFILE
              value: "false"
            - name: ONLINE_MODE
              value: "true"
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "8Gi"
              cpu: "4"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minecraft-bta-data
