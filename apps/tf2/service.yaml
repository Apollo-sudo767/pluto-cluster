apiVersion: v1
kind: Service
metadata:
  name: tf2-service
  namespace: games
  labels:
    app: tf2
spec:
  type: NodePort
  selector:
    app: tf2
  ports:
    - name: game
      port: 27015
      targetPort: 27015
      nodePort: 27015
      protocol: UDP
    - name: rcon
      port: 27015
      targetPort: 27015
      nodePort: 27015
      protocol: TCP
    - name: sourcetv
      port: 27020
      targetPort: 27020
      nodePort: 27020
      protocol: UDP
