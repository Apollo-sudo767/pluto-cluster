apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: productivity
  labels:
    app: element-web
    component: client
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: element-web
      component: client
  template:
    metadata:
      labels:
        app: element-web
        component: client
    spec:
      # Stateless web client — runs on styx, hydra, or pluto (prefers M920q control-plane nodes to keep compute free)
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 50
              preference:
                matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - styx
                      - hydra
                      - pluto
      containers:
        - name: element-web
          image: vectorim/element-web:latest
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /config.json
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /config.json
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: element-config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: productivity
  labels:
    app: element-web
    component: client
spec:
  type: ClusterIP
  selector:
    app: element-web
    component: client
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
