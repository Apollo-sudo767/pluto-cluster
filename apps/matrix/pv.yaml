apiVersion: v1
kind: PersistentVolume
metadata:
  name: matrix-nas-pv
  labels:
    app: matrix
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - noatime
    - hard
    - timeo=600
    - retrans=2
  nfs:
    # Ubiquiti UniFi UNAS Pro 4 discovered on the home network (192.168.11.0/24)
    server: "192.168.11.76"
    # UniFi Drive NFS export path for MatrixActual
    path: "/volume/e0020ac1-393d-4b38-97b0-f009b5dfb5f1/.srv/.unifi-drive/MatrixActual/.data"
  claimRef:
    namespace: productivity
    name: matrix-data
