apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
    app.kubernetes.io/part-of: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
        app.kubernetes.io/part-of: jellyfin
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-31T15:37:00Z"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - hydra
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
      initContainers:
        - name: sync-seed-and-restore
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              mkdir -p /media/.jellyfin-seed
              if [ -f /seed/jellyfin-config.tar.gz ] && [ ! -f /media/.jellyfin-seed/jellyfin-config.tar.gz ]; then
                echo "Copying Jellyfin seed tarball to shared NFS storage..."
                cp /seed/jellyfin-config.tar.gz /media/.jellyfin-seed/jellyfin-config.tar.gz
                chmod 666 /media/.jellyfin-seed/jellyfin-config.tar.gz
                echo "Seed copy completed."
              fi
              if [ -f /seed/jellyfin-fresh.db ]; then
                echo "Copying fresh live DB snapshot to shared NFS storage..."
                cp /seed/jellyfin-fresh.db /media/.jellyfin-seed/jellyfin-fresh.db
                chmod 666 /media/.jellyfin-seed/jellyfin-fresh.db
              fi
              if [ ! -f /config/data/jellyfin.db ] && [ -f /seed/jellyfin-config.tar.gz ]; then
                echo "Restoring Jellyfin config from seed tarball..."
                tar -xzf /seed/jellyfin-config.tar.gz -C /config/
                chmod -R 777 /config
                echo "Restore completed successfully."
              else
                echo "Existing config present, skipping extract."
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: seed
              mountPath: /seed
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-v3
        - name: media
          persistentVolumeClaim:
            claimName: media-storage
        - name: dri
          hostPath:
            path: /dev/dri
        - name: seed
          hostPath:
            path: /persist/home/apollo
            type: Directory
