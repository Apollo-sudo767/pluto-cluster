apiVersion: apps/v1
kind: Deployment
metadata:
  name: pocket-id
  namespace: infrastructure
  labels:
    app.kubernetes.io/name: pocket-id
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pocket-id
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pocket-id
    spec:
      # Pin to hydra or styx (keeping pluto compute dedicated to game servers)
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - styx
                      - hydra
      containers:
        - name: pocket-id
          image: ghcr.io/pocket-id/pocket-id:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 1411
              name: http
              protocol: TCP
          env:
            - name: APP_URL
              value: "https://auth.apollan.cc"
            - name: TRUST_PROXY
              value: "true"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: pocket-id-secret
                  key: ENCRYPTION_KEY
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pocket-id-data
