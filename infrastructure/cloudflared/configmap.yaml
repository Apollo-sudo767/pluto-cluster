apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared-config
  namespace: cloudflared
data:
  config.yaml: |
    tunnel: pluto-cluster
    credentials-file: /etc/cloudflared/creds/credentials.json
    metrics: 0.0.0.0:2000
    no-autoupdate: true
    ingress:
      - hostname: jellyfin.apollan.cc
        service: http://jellyfin.media.svc.cluster.local:8096
      - hostname: homeassistant.apollan.cc
        service: http://home-assistant.home-automation.svc.cluster.local:8123
      - hostname: joplin.apollan.cc
        service: http://joplin.productivity.svc.cluster.local:22300
      - hostname: zotero.apollan.cc
        service: http://zotero.productivity.svc.cluster.local:80
      - hostname: matrix.apollan.cc
        service: http://matrix.productivity.svc.cluster.local:8008
      - hostname: rtc.apollan.cc
        service: http://matrix-rtc.productivity.svc.cluster.local:8080
      - hostname: chat.apollan.cc
        service: http://element-web.productivity.svc.cluster.local:80
      - hostname: element.apollan.cc
        service: http://element-web.productivity.svc.cluster.local:80
      - hostname: auth.apollan.cc
        service: http://pocket-id.infrastructure.svc.cluster.local:80
      - hostname: requests.apollan.cc
        service: http://jellyseerr.media.svc.cluster.local:5055
      - hostname: jellyseerr.apollan.cc
        service: http://jellyseerr.media.svc.cluster.local:5055
      - hostname: prowlarr.apollan.cc
        service: http://prowlarr.media.svc.cluster.local:9696
      - hostname: radarr.apollan.cc
        service: http://radarr.media.svc.cluster.local:7878
      - hostname: sonarr.apollan.cc
        service: http://sonarr.media.svc.cluster.local:8989
      - hostname: torrents.apollan.cc
        service: http://qbittorrent.media.svc.cluster.local:8080
      - hostname: qbittorrent.apollan.cc
        service: http://qbittorrent.media.svc.cluster.local:8080
      - service: http_status:404
