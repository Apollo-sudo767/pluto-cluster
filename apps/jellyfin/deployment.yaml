apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
  labels:
    app: jellyfin
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-10-30T15:32:00Z"
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - hydra
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
      initContainers:
        - name: restore-config
          image: busybox:latest
          command:
            - sh
            - -c
            - |
              if [ ! -f /config/data/jellyfin.db ]; then
                echo "Restoring Jellyfin config from seed tarball..."
                if [ -f /seed/jellyfin-config.tar.gz ]; then
                  tar -xzf /seed/jellyfin-config.tar.gz -C /config/
                  chmod -R 777 /config
                  echo "Restore completed successfully."
                else
                  echo "Seed tarball not found at /seed/jellyfin-config.tar.gz"
                fi
              else
                echo "Jellyfin config already present in volume, skipping restore."
              fi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: seed
              mountPath: /seed
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - containerPort: 8096
              name: http
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "500m"
              memory: 2Gi
            limits:
              cpu: "4"
              memory: 8Gi
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /media
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config-v3
        - name: media
          persistentVolumeClaim:
            claimName: media-storage
        - name: dri
          hostPath:
            path: /dev/dri
        - name: seed
          hostPath:
            path: /tmp
            type: Directory
