apiVersion: v1
kind: ConfigMap
metadata:
  name: matrix-config
  namespace: productivity
  labels:
    app: matrix
data:
  tuwunel.toml: |
    [global]
    # Primary Matrix homeserver domain
    server_name = "matrix.apollan.cc"

    # Listen on all container interfaces on standard Matrix HTTP port
    address = ["0.0.0.0"]
    port = 8008

    # Data & media stored on the UniFi UNAS Pro 4 (192.168.11.76:/var/nfs/shared/MatrixActual)
    database_path = "/var/lib/tuwunel/db"
    database_backup_path = "/var/lib/tuwunel/backups"
    database_backups_to_keep = 3

    # RocksDB tunings optimized for NFSv4.1 / NAS storage + generous node RAM caching
    rocksdb_direct_io = false
    rocksdb_optimize_for_spinning_disks = true
    rocksdb_compression_algo = "zstd"
    db_cache_capacity_mb = 512
    pdu_cache_capacity = 200000

    # Media upload limits (100 MiB for high-res video clips, voice notes, and attachments)
    max_request_size = "100 MiB"

    # Account Registration (token-protected account creation)
    allow_registration = true
    registration_token_file = "/var/lib/tuwunel/.secrets/registration_token"
    registration_shared_secret_file = "/var/lib/tuwunel/.secrets/registration_shared_secret"

    # Room & encryption defaults
    allow_encryption = true
    encryption_enabled_by_default_for_room_type = "invite"
    allow_federation = true
    allow_room_creation = true
    enable_set_displayname = true
    trusted_servers = ["matrix.org"]

    # Public STUN/TURN relay for 1:1 WebRTC VoIP (Metered OpenRelay)
    turn_uris = [
      "turn:openrelay.metered.ca:80",
      "turn:openrelay.metered.ca:443",
      "turn:openrelay.metered.ca:443?transport=tcp"
    ]
    turn_username = "openrelayproject"
    turn_password = "openrelayproject"

    # Trust Cloudflare Tunnel proxy headers for accurate client rate-limiting
    ip_source = "cf_connecting_ip"

    # Prefer IPv4 first to avoid IPv6 DNS timeouts inside the cluster
    ip_lookup_strategy = 5

    # Dedicated NAS media directory under the mounted UNAS Pro 4 volume
    media_storage_providers = ["media"]

    [global.storage_provider.media.local]
    base_path = "/var/lib/tuwunel/media"
    create_if_missing = true
    delete_empty_directories = true
    startup_check = true

    # Auto-discovery (.well-known/matrix/client & .well-known/matrix/server)
    # Publishes both the homeserver URL and the MatrixRTC (LiveKit) voice/streaming endpoint
    [global.well_known]
    client = "https://matrix.apollan.cc"
    server = "matrix.apollan.cc:443"
    livekit_url = "https://rtc.apollan.cc"

  element-config.json: |
    {
      "default_server_config": {
        "m.homeserver": {
          "base_url": "https://matrix.apollan.cc",
          "server_name": "matrix.apollan.cc"
        }
      },
      "brand": "Solar Matrix",
      "disable_custom_urls": false,
      "disable_guests": true,
      "disable_login_language_selector": false,
      "disable_3pid_login": false,
      "default_theme": "dark",
      "room_directory": {
        "servers": [
          "matrix.apollan.cc",
          "matrix.org"
        ]
      },
      "features": {
        "feature_group_calls": true,
        "feature_element_call_video_rooms": true
      },
      "element_call": {
        "url": "https://call.element.io",
        "use_exclusively": false,
        "brand": "Solar Call"
      },
      "setting_defaults": {
        "UIFeature.registration": true,
        "UIFeature.voip": true
      }
    }

  rtc-nginx.conf: |
    server {
      listen 8080;
      server_name _;

      # CORS headers for MatrixRTC / Element Call discovery and token exchange
      location /sfu/get {
        proxy_pass http://127.0.0.1:8081/sfu/get;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
      }

      location /healthz {
        proxy_pass http://127.0.0.1:8081/healthz;
      }

      # LiveKit WebSocket signaling & API
      location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 86400;
      }
    }
