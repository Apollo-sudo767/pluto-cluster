apiVersion: v1
kind: PersistentVolume
metadata:
  name: media-nas-pv
  labels:
    app: media
spec:
  capacity:
    storage: 1Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=3
    - nolock
    - proto=tcp
    - port=2049
    - mountproto=udp
    - mountport=38401
  nfs:
    # Ubiquiti UniFi UNAS Pro 4 discovered on the home network (192.168.11.0/24)
    server: "192.168.11.76"
    # UniFi Drive NFS export path for MediaStorage on Storage Pool 3
    path: "/volume/39e5493f-d7db-4c23-953a-e93aca6df38d/.srv/.unifi-drive/MediaStorage/.data"
  claimRef:
    namespace: media
    name: media-storage
