apiVersion: apps/v1
kind: Deployment
metadata:
  name: element-web
  namespace: productivity
  labels:
    app: element-web
    component: client
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: element-web
      component: client
  template:
    metadata:
      annotations:
        rollout: "v7-ha-failover"
      labels:
        app: element-web
        component: client
    spec:
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 15
      # Spread replicas across cluster nodes so at least one instance is always running
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: element-web
      containers:
        - name: element-web
          image: vectorim/element-web:latest
          env:
            - name: ELEMENT_WEB_PORT
              value: "80"
          ports:
            - containerPort: 80
              name: http
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /config.json
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /config.json
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: "25m"
              memory: "32Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          volumeMounts:
            - name: config
              mountPath: /app/config.json
              subPath: element-config.json
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: matrix-config
---
apiVersion: v1
kind: Service
metadata:
  name: element-web
  namespace: productivity
  labels:
    app: element-web
    component: client
spec:
  type: ClusterIP
  selector:
    app: element-web
    component: client
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
