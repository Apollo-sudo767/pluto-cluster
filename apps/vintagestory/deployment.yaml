apiVersion: apps/v1
kind: Deployment
metadata:
  name: vintagestory-server
  namespace: games
  labels:
    app: vintagestory
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vintagestory
  template:
    metadata:
      labels:
        app: vintagestory
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: node.type
                    operator: In
                    values:
                      - compute
      tolerations:
        - key: "node.kubernetes.io/not-ready"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
        - key: "node.kubernetes.io/unreachable"
          operator: "Exists"
          effect: "NoExecute"
          tolerationSeconds: 30
      initContainers:
        - name: init-mods
          image: curlimages/curl:latest
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -c
            - |
              set -e
              MODS_DIR="/home/vintagestory/server-data/Mods"
              mkdir -p "$MODS_DIR"

              # Automated Vintage Horizons update via ModDB API
              echo "Checking ModDB for Vintage Horizons updates..."
              API_JSON=$(curl -sSL --max-time 15 "https://mods.vintagestory.at/api/mod/vintagehorizons" || true)
              FILE_ID=$(echo "$API_JSON" | grep -o "\"fileid\":[0-9]*" | head -n 1 | cut -d: -f2 || true)
              FILE_NAME=$(echo "$API_JSON" | grep -o "\"filename\":\"[^\"]*\"" | head -n 1 | cut -d\" -f4 || true)

              if [ -n "$FILE_ID" ] && [ -n "$FILE_NAME" ]; then
                if [ -f "$MODS_DIR/$FILE_NAME" ]; then
                  echo "Vintage Horizons is already up-to-date ($FILE_NAME)."
                else
                  echo "Updating Vintage Horizons to $FILE_NAME..."
                  rm -f "$MODS_DIR"/vintagehorizons*.zip
                  curl -sSL -o "$MODS_DIR/$FILE_NAME" "https://mods.vintagestory.at/download/${FILE_ID}/${FILE_NAME}"
                  echo "Vintage Horizons updated successfully."
                fi
              else
                echo "Warning: Could not query ModDB API; checking local cache..."
                if ! ls "$MODS_DIR"/vintagehorizons*.zip >/dev/null 2>&1; then
                  echo "Falling back to default release v0.3.1..."
                  curl -sSL -o "$MODS_DIR/vintagehorizons_0.3.1.zip" "https://mods.vintagestory.at/download/118969/vintagehorizons_0.3.1.zip"
                fi
              fi
          volumeMounts:
            - name: data
              mountPath: /home/vintagestory/server-data
              subPath: server-data
      containers:
        - name: vintagestory
          image: indifferentbroccoli/vintage-story-server-docker:latest
          ports:
            - containerPort: 42420
              hostPort: 42420
              name: game-tcp
              protocol: TCP
            - containerPort: 42420
              hostPort: 42420
              name: game-udp
              protocol: UDP
          env:
            - name: SERVER_NAME
              value: "Pluto | Vintage Story Server [St. Louis, MO]"
            - name: SERVER_PASSWORD
              value: "phasgang"
            - name: UPDATE_ON_START
              value: "true"
            - name: MAX_PLAYERS
              value: "16"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              memory: "2Gi"
              cpu: "1"
            limits:
              memory: "6Gi"
              cpu: "3"
          volumeMounts:
            - name: data
              mountPath: /home/vintagestory/server-data
              subPath: server-data
            - name: data
              mountPath: /home/vintagestory/server-files
              subPath: server-files
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vintagestory-data
